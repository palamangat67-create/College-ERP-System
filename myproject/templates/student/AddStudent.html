{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:#eef2ff;
height:100vh;
overflow:hidden;

}

.container{

width:100%;
height:100vh;
display:flex;

}

/* Left Panel */

.left{

width:340px;
background:linear-gradient(180deg,#0f172a,#1d4ed8);

color:#fff;

padding:35px;

display:flex;

flex-direction:column;

align-items:center;

overflow:auto;

}

.photo{

width:180px;

height:180px;

border-radius:50%;

overflow:hidden;

border:5px solid white;

box-shadow:0 15px 30px rgba(0,0,0,.3);

margin-top:15px;

}

.photo img{

width:100%;

height:100%;

object-fit:cover;

}

.upload{

margin-top:25px;

}

.upload label{

padding:12px 28px;

background:white;

color:#2563eb;

font-weight:bold;

border-radius:30px;

cursor:pointer;

display:inline-block;

transition:.3s;

}

.upload label:hover{

transform:scale(1.05);

}

input[type=file]{

display:none;

}

.profile{

text-align:center;

margin-top:25px;

}

.profile h2{

font-size:24px;

margin-bottom:8px;

}

.profile p{

color:#cbd5e1;

}

.card{

width:100%;

background:rgba(255,255,255,.15);

margin-top:35px;

padding:20px;

border-radius:15px;

}

.card h3{

margin-bottom:15px;

}

.card p{

margin:10px 0;

font-size:15px;

}

/* Right Panel */

.right{

flex:1;

background:#f8fafc;

padding:40px;

overflow-y:auto;

}

.heading{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.heading h1{

font-size:34px;

color:#1e3a8a;

}

.badge{

background:#2563eb;

color:white;

padding:10px 20px;

border-radius:30px;

font-weight:bold;

}

.section{

font-size:22px;

font-weight:bold;

color:#1e3a8a;

margin:30px 0 20px;

border-left:5px solid #2563eb;

padding-left:12px;

}

.row{

display:flex;

gap:20px;

margin-bottom:20px;

}

.box{

flex:1;

display:flex;

flex-direction:column;

}

.box label{

font-weight:600;

margin-bottom:8px;

color:#334155;

}

.box input,
.box select,
.box textarea{

padding:14px;

border:2px solid #dbeafe;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.box input:focus,
.box select:focus,
.box textarea:focus{

border-color:#2563eb;

box-shadow:0 0 8px rgba(37,99,235,.25);

}

textarea{

height:120px;

resize:none;

}

.btn-box{

margin-top:30px;

display:flex;

justify-content:flex-end;

gap:15px;

}

.btn{

padding:14px 35px;

border:none;

border-radius:12px;

font-size:16px;

cursor:pointer;

font-weight:bold;

}

.reset{

background:#e2e8f0;

}

.save{

background:#2563eb;

color:white;

}

.save:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="container">

<div class="left">

<div class="photo">

<img
id="preview"
src="https://via.placeholder.com/180"
alt="">

</div>

<div class="upload">

<label for="photo">

<i class="fa-solid fa-camera"></i>

Upload Photo

</label>

<input
type="file"
id="photo"
name="photo"
accept="image/*"
onchange="previewImage(event)">

</div>

<div class="profile">

<h2>Student Profile</h2>

<p>College ERP System</p>

</div>

<div class="card">

<h3>Quick Details</h3>

<p>🎓 Student Registration</p>

<p>📷 Upload Passport Photo</p>

<p>📚 Academic Record</p>

<p>📞 Contact Information</p>

<p>🏠 Hostel & Transport</p>

</div>

</div>

<div class="right">

<div class="heading">

<h1>Add Student</h1>

<div class="badge">

Student Registration

</div>

</div>

<div class="section">

Personal Information

</div>
<!-- Student Name & Roll No -->

<div class="row">

<div class="box">

<label>
<i class="fa-solid fa-user"></i>
Student Name
</label>

<input
type="text"
name="student_name"
placeholder="Enter Student Name"
required>

</div>

<div class="box">

<label>
<i class="fa-solid fa-id-card"></i>
Roll Number
</label>

<input
type="text"
name="roll_no"
placeholder="Enter Roll Number"
required>

</div>

</div>

<!-- Father & Mother Name -->

<div class="row">

<div class="box">

<label>
<i class="fa-solid fa-user-tie"></i>
Father Name
</label>

<input
type="text"
name="father_name"
placeholder="Enter Father Name"
required>

</div>

<div class="box">

<label>
<i class="fa-solid fa-person-dress"></i>
Mother Name
</label>

<input
type="text"
name="mother_name"
placeholder="Enter Mother Name"
required>

</div>

</div>

<!-- Gender & DOB -->

<div class="row">

<div class="box">

<label>
<i class="fa-solid fa-venus-mars"></i>
Gender
</label>

<select name="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="box">

<label>
<i class="fa-solid fa-calendar-days"></i>
Date of Birth
</label>

<input
type="date"
name="dob"
required>

</div>

</div>

<!-- Blood Group & Mobile -->

<div class="row">

<div class="box">

<label>
<i class="fa-solid fa-droplet"></i>
Blood Group
</label>

<select name="blood_group" required>

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="box">

<label>
<i class="fa-solid fa-phone"></i>
Mobile Number
</label>

<input
type="text"
name="mobile"
maxlength="10"
placeholder="Enter Mobile Number"
required>

</div>

</div>

<!-- Email -->

<div class="row">

<div class="box">

<label>
<i class="fa-solid fa-envelope"></i>
Email Address
</label>

<input
type="email"
name="email"
placeholder="student@gmail.com"
required>

</div>

<div class="box">

<label>
<i class="fa-solid fa-location-dot"></i>
Address
</label>

<textarea
name="address"
placeholder="Enter Complete Address"
required></textarea>

</div>

</div>

<div class="section">

Academic Information

</div>
<!-- ==========================
Academic Information
========================== -->

<div class="row">

    <div class="box">

        <label>
            <i class="fa-solid fa-graduation-cap"></i>
            Course
        </label>

        <select name="course" required>

            <option value="">Select Course</option>

            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
            <option>BA</option>
            <option>B.Sc</option>

        </select>

    </div>

    <div class="box">

        <label>
            <i class="fa-solid fa-book"></i>
            Semester
        </label>

        <select name="semester" required>

            <option value="">Select Semester</option>

            <option>1st Semester</option>
            <option>2nd Semester</option>
            <option>3rd Semester</option>
            <option>4th Semester</option>
            <option>5th Semester</option>
            <option>6th Semester</option>

        </select>

    </div>

</div>

<!-- ==========================
Facilities
========================== -->

<div class="section">

Facilities

</div>

<div class="row">

    <div class="box">

        <label>
            <i class="fa-solid fa-building"></i>
            Hostel Facility
        </label>

        <select name="hostel">

            <option value="">Select</option>

            <option>Yes</option>

            <option>No</option>

        </select>

    </div>

    <div class="box">

        <label>
            <i class="fa-solid fa-bus"></i>
            Transport Facility
        </label>

        <select name="transport">

            <option value="">Select</option>

            <option>Yes</option>

            <option>No</option>

        </select>

    </div>

</div>

<!-- ==========================
Buttons
========================== -->

<div class="btn-box">

<button type="reset" class="btn reset">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button type="submit" class="btn save">

<i class="fa-solid fa-floppy-disk"></i>

Save Student

</button>

</div>

</div>

</div>

</form>

<script>

function previewImage(event){

    const file = event.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            document.getElementById("preview").src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

}

</script>

</body>

</html>
