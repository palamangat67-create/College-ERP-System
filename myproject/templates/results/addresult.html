{% load static %}
<!DOCTYPE html>
<html>
<head>

    <title>Add Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .header {
            background: #0b1f4d;
            color: white;
            padding: 25px 30px;
            border-radius: 15px 15px 0 0;
        }

        .header h2 {
            margin: 0;
            font-size: 27px;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.8;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d5d9e0;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #0b1f4d;
        }

        .btn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b1f4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #163b82;
        }

        @media(max-width: 700px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h2>Add Student Result</h2>

        <p>Enter examination and subject marks</p>

    </div>


    <div class="form-box">

        <form method="POST">

            {% csrf_token %}


            <!-- Student -->

            <div class="form-row">

                <div class="form-group">

                    <label>Student</label>

                    <select name="student" required>

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">

                            {{ student.roll_no }} -
                            {{ student.student_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Semester -->

                <div class="form-group">

                    <label>Semester</label>

                    <select name="semester" required>

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1st Semester">
                            1st Semester
                        </option>

                        <option value="2nd Semester">
                            2nd Semester
                        </option>

                        <option value="3rd Semester">
                            3rd Semester
                        </option>

                        <option value="4th Semester">
                            4th Semester
                        </option>

                        <option value="5th Semester">
                            5th Semester
                        </option>

                        <option value="6th Semester">
                            6th Semester
                        </option>

                    </select>

                </div>

            </div>


            <!-- Subject + Exam -->

            <div class="form-row">

                <div class="form-group">

                    <label>Subject</label>

                    <input
                        type="text"
                        name="subject"
                        placeholder="Enter subject name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Exam Type</label>

                    <select name="exam_type" required>

                        <option value="">
                            Select Exam Type
                        </option>

                        <option value="Mid Term">
                            Mid Term
                        </option>

                        <option value="Final">
                            Final
                        </option>

                        <option value="Practical">
                            Practical
                        </option>

                        <option value="Internal">
                            Internal
                        </option>

                    </select>

                </div>

            </div>


            <!-- Marks -->

            <div class="form-row">

                <div class="form-group">

                    <label>Maximum Marks</label>

                    <input
                        type="number"
                        name="max_marks"
                        value="100"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Marks Obtained</label>

                    <input
                        type="number"
                        name="marks_obtained"
                        placeholder="Enter marks"
                        min="0"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="btn">
                Save Result
            </button>

        </form>

    </div>

</div>

</body>
</html>
