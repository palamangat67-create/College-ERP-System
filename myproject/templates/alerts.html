{% if messages %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
{% for message in messages %}
Swal.fire({
    icon:"{{ message.level_tag|escapejs }}",
    title:"{{ message|escapejs }}",
    confirmButtonColor:"#2563eb",
    timer:2500,
    timerProgressBar:true
});
{% endfor %}
</script>
{% endif %}
