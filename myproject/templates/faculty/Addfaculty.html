{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Information</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#172554,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px;

}

.container{

width:1100px;
background:#fff;
border-radius:25px;
overflow:hidden;
display:flex;
box-shadow:0 20px 50px rgba(0,0,0,.35);
animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* LEFT PANEL */

.left{

width:330px;
background:linear-gradient(180deg,#1e3a8a,#2563eb);
padding:40px 30px;
color:white;
text-align:center;
position:relative;

}

.left h2{

margin-top:20px;
font-size:28px;

}

.left p{

margin-top:8px;
color:#dbeafe;

}

.profile{

width:180px;
height:180px;
margin:auto;
border-radius:50%;
overflow:hidden;
border:5px solid white;
box-shadow:0 10px 30px rgba(0,0,0,.3);

}

.profile img{

width:100%;
height:100%;
object-fit:cover;

}

.upload{

margin-top:20px;

}

.upload label{

display:inline-block;
padding:12px 25px;
background:white;
color:#2563eb;
border-radius:30px;
cursor:pointer;
font-weight:bold;
transition:.3s;

}

.upload label:hover{

transform:scale(1.05);

}

.upload input{

display:none;

}

.info-card{

margin-top:40px;
background:rgba(255,255,255,.15);
padding:20px;
border-radius:15px;
text-align:left;

}

.info-card h3{

margin-bottom:10px;

}

.info-card p{

margin:12px 0;
font-size:15px;

}

/* RIGHT PANEL */

.right{

flex:1;
padding:40px;

}

.right h1{

color:#1e3a8a;
margin-bottom:30px;

}

.row{

display:flex;
gap:20px;
margin-bottom:20px;

}

.box{

flex:1;
display:flex;
flex-direction:column;

}

.box label{

font-weight:600;
margin-bottom:8px;
color:#1e3a8a;

}

.box input,
.box select,
.box textarea{

padding:14px;
border:2px solid #dbeafe;
border-radius:12px;
outline:none;
transition:.3s;
font-size:15px;

}

.box input:focus,
.box select:focus,
.box textarea:focus{

border-color:#2563eb;
box-shadow:0 0 12px rgba(37,99,235,.25);

}

textarea{

height:110px;
resize:none;

}
/* Gender */

.gender{

display:flex;
gap:25px;
margin-top:12px;

}

.gender label{

display:flex;
align-items:center;
gap:8px;
cursor:pointer;
font-weight:500;

}

.gender input{

accent-color:#2563eb;
transform:scale(1.2);

}

/* Buttons */

.btn-box{

display:flex;
justify-content:flex-end;
gap:20px;
margin-top:30px;

}

.btn{

padding:14px 35px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

.save{

background:#2563eb;
color:white;

}

.save:hover{

background:#1d4ed8;
transform:translateY(-3px);

}

.reset{

background:#e2e8f0;
color:#1e293b;

}

.reset:hover{

background:#cbd5e1;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.left{

width:100%;

}

.row{

flex-direction:column;

}

.btn-box{

justify-content:center;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="profile">

<img id="preview"
src="https://via.placeholder.com/180">

</div>

<div class="upload">

<label for="photo">
📷 Change Photo
</label>

<input
type="file"
id="photo"
accept="image/*"
onchange="previewImage(event)">

</div>

<h2>Faculty Profile</h2>



<div class="info-card">

<h3>Quick Info</h3>

<p>🏢 Employee Record</p>

<p>📚 Faculty Management</p>

<p>🎓 College ERP</p>

<p>🟢 Active Member</p>

</div>

</div>

<div class="right">

<h1>Faculty Information</h1>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<div class="box">

<label>Faculty Name</label>

<input
type="text"
name="faculty_name"
placeholder="Enter Faculty Name"
required>

</div>

<div class="box">

<label>Employee ID</label>

<input
type="text"
name="employee_id"
placeholder="EMP001"
required>

</div>

</div>

<div class="row">

<div class="box">

<label>Department</label>

<select name="department">

<option>Select Department</option>

<option>Computer Science</option>

<option>Information Technology</option>

<option>Commerce</option>

<option>Management</option>

<option>Mathematics</option>

<option>English</option>

</select>

</div>

<div class="box">

<label>Designation</label>

<select name="designation">

<option>Select Designation</option>

<option>Professor</option>

<option>Associate Professor</option>

<option>Assistant Professor</option>

<option>Lecturer</option>

</select>

</div>

</div>
<div class="row">

<div class="box">

<label>Gender</label>

<div class="gender">

<label>
<input type="radio" name="gender" value="Male" required>
Male
</label>

<label>
<input type="radio" name="gender" value="Female">
Female
</label>

<label>
<input type="radio" name="gender" value="Other">
Other
</label>

</div>

</div>

<div class="box">

<label>Date of Birth</label>

<input
type="date"
name="dob"
required>

</div>

</div>

<div class="row">

<div class="box">

<label>Qualification</label>

<input
type="text"
name="qualification"
placeholder="MCA / M.Tech / Ph.D"
required>

</div>

<div class="box">

<label>Experience (Years)</label>

<input
type="number"
name="experience"
min="0"
max="40"
placeholder="5"
required>

</div>

</div>

<div class="row">

<div class="box">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="faculty@college.com"
required>

</div>

<div class="box">

<label>Mobile Number</label>

<input
type="tel"
name="mobile"
maxlength="10"
placeholder="9876543210"
required>

</div>

</div>

<div class="row">

<div class="box">

<label>Address</label>

<textarea
name="address"
placeholder="Enter Complete Address"
required></textarea>

</div>

</div>

<div class="btn-box">

<button
type="submit"
class="btn save">

💾 Save Faculty

</button>

<button
type="reset"
class="btn reset">

🔄 Reset

</button>

</div>

</form>

</div>

</div>

<script>

function previewImage(event){

const file = event.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

document.getElementById("preview").src = e.target.result;

}

reader.readAsDataURL(file);

}

}

</script>

</body>
</html>
